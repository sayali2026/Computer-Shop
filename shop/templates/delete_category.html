{% extends 'base.html' %}
{% block title %}Delete Category - TechShop{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Confirm Delete</h4>
                </div>
                <div class="card-body text-center py-5">
                    <h3 class="text-danger mb-3">Delete "{{ category.name }}" category?</h3>
                    <p class="lead text-warning">
                        ⚠️ This will delete <strong>{{ category.product_set.count }} products</strong> too!
                    </p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="btn-group">
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="fas fa-trash"></i> Yes, Delete All
                            </button>
                            <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary btn-lg">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
