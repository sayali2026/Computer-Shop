{% extends 'base.html' %}
{% block title %}Add Product - TechShop{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0 fw-bold">
                        <i class="fas fa-plus me-2"></i>Add New Product
                    </h3>
                </div>
                <div class="card-body p-5">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="row g-4">
                            <!-- Product Image -->
                            <div class="col-12">
                                <label class="form-label fw-bold fs-5 mb-2">
                                    <i class="fas fa-image me-2 text-primary"></i>Product Image
                                </label>
                                <div class="border border-2 border-dashed p-4 text-center rounded" 
                                     style="min-height: 200px; background: #f8f9fa;">
                                    <input type="file" class="form-control" name="image" accept="image/*">
                                    <small class="text-muted mt-2 d-block">
                                        PNG, JPG up to 5MB • Recommended 400x400px
                                    </small>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold fs-5 mb-2">Product Name</label>
                                <input type="text" class="form-control form-control-lg" name="name" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold fs-5 mb-2">Category</label>
                                <select class="form-control form-control-lg" name="category" required>
                                    <option value="">Select Category</option>
                                    {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold fs-5 mb-2">Price (₹)</label>
                                <input type="number" step="0.01" class="form-control form-control-lg" name="price" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold fs-5 mb-2">Stock</label>
                                <input type="number" class="form-control form-control-lg" name="stock" value="0" min="0">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold fs-5 mb-2">Description</label>
                                <textarea class="form-control form-control-lg" name="description" rows="4" 
                                          placeholder="Enter product description..."></textarea>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-3 mt-5">
                            <button type="submit" class="btn btn-success btn-lg flex-grow-1 py-3 fs-5">
                                <i class="fas fa-save me-2"></i>Add Product
                            </button>
                            <a href="{% url 'home' %}" class="btn btn-secondary btn-lg py-3 px-5 fs-5">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
