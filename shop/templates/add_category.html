{% extends 'base.html' %}
{% block title %}Add Category - TechShop{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-info text-white">
                    <h3 class="mb-0 fw-bold">
                        <i class="fas fa-tags me-2"></i>Add New Category
                    </h3>
                </div>
                <div class="card-body p-5">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-5">
                            <label class="form-label fw-bold fs-5 mb-3">Category Name</label>
                            <input type="text" class="form-control form-control-lg text-center" 
                                   name="name" placeholder="e.g. Laptops, Gaming PCs" required>
                        </div>
                        
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-info btn-lg flex-grow-1 py-3 fs-5 text-white">
                                <i class="fas fa-plus me-2"></i>Create Category
                            </button>
                            <a href="{% url 'home' %}" class="btn btn-secondary btn-lg py-3 px-4 fs-5">Back to Dashboard</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
